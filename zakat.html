<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>যাকাত ক্যালকুলেটর - NoorPath</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0A2E1F 0%, #1B5E20 100%);
            color: white; min-height: 100vh; padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .back-btn { color: #D4AF37; text-decoration: none; display: inline-block; margin-bottom: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #D4AF37; font-size: 32px; margin-bottom: 10px; }
        .header p { color: #aaa; font-size: 14px; }
        .calc-card {
            background: rgba(255,255,255,0.06); padding: 24px; border-radius: 16px;
            border: 1px solid rgba(212, 175, 55, 0.2); margin-bottom: 20px;
        }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; margin-bottom: 8px; color: #D4AF37; font-size: 14px; }
        .input-group input {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.2); color: white; font-size: 16px;
        }
        .input-group input:focus { outline: none; border-color: #D4AF37; }
        .result-box {
            background: rgba(212, 175, 55, 0.15); padding: 20px; border-radius: 12px;
            text-align: center; margin-top: 20px; border: 1px solid #D4AF37;
        }
        .result-box h3 { color: #D4AF37; font-size: 18px; margin-bottom: 10px; }
        .result-amount { font-size: 36px; font-weight: bold; color: white; }
        .btn {
            width: 100%; padding: 14px; background: #D4AF37; color: #0A2E1F; border: none;
            border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        .btn:hover { background: #e6c34b; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← হোমে ফিরে যান</a>
        <div class="header">
            <h1>💰 যাকাত ক্যালকুলেটর</h1>
            <p>আপনার সম্পদের সঠিক যাকাত হিসাব করুন</p>
        </div>

        <div class="calc-card">
            <div class="input-group">
                <label>নগদ টাকা (বাংলাদেশি টাকা)</label>
                <input type="number" id="cash" placeholder="যেমন: 50000" oninput="calculateZakat()">
            </div>
            <div class="input-group">
                <label>সোনার মূল্য (টাকায়)</label>
                <input type="number" id="gold" placeholder="যেমন: 100000" oninput="calculateZakat()">
            </div>
            <div class="input-group">
                <label>রূপার মূল্য (টাকায়)</label>
                <input type="number" id="silver" placeholder="যেমন: 20000" oninput="calculateZakat()">
            </div>
            <div class="input-group">
                <label>ব্যবসার মালের মূল্য (টাকায়)</label>
                <input type="number" id="business" placeholder="যেমন: 30000" oninput="calculateZakat()">
            </div>
        </div>

        <div class="result-box">
            <h3>আপনার মোট যাকাত (২.৫%)</h3>
            <div class="result-amount" id="zakatResult">০ ৳</div>
        </div>
    </div>

    <script>
        function calculateZakat() {
            const cash = parseFloat(document.getElementById('cash').value) || 0;
            const gold = parseFloat(document.getElementById('gold').value) || 0;
            const silver = parseFloat(document.getElementById('silver').value) || 0;
            const business = parseFloat(document.getElementById('business').value) || 0;

            const totalWealth = cash + gold + silver + business;
            const zakat = totalWealth * 0.025; // ২.৫%

            // বাংলা সংখ্যায় রূপান্তর
            const formattedZakat = zakat.toLocaleString('bn-BD', { maximumFractionDigits: 0 });
            document.getElementById('zakatResult').innerText = formattedZakat + ' ৳';
        }
    </script>
</body>
</html>
