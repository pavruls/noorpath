# ============================================================
# Project-wide Gradle settings
# ============================================================

# ============================================================
# JVM Arguments for Gradle Daemon
# ============================================================
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# ============================================================
# Kotlin Compile Daemon JVM Args (GC auto-selection fix)
# ============================================================
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:-UseParallelGC -Dfile.encoding=UTF-8

# ============================================================
# Build Performance
# ============================================================
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false

# ============================================================
# AndroidX (REQUIRED ? ?? ?????? missing ???)
# ============================================================
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# ============================================================
# Kotlin Incremental Compilation
# ============================================================
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# ============================================================
# KSP Incremental
# ============================================================
ksp.incremental=true

# ============================================================
# R8/ProGuard Optimization
# ============================================================
android.enableR8.fullMode=true

# ============================================================
# Non-final Resource IDs
# ============================================================
android.nonFinalResIds=false